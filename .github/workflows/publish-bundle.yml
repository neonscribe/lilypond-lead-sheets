# Publish the MusicForge bundle as a GitHub release.
#
# Every push to main that touches Core/, Include/ or Wrappers/ (and any manual
# run) builds one zip from this checkout with MusicForge's bundle builder and
# publishes it as a release tagged bundle-<run number>, with the zip as its
# only asset. The MusicForge app reads the latest release of this repo through
# the public GitHub API, compares its ordinal (the number in the tag) with the
# release the user last imported, and offers the download on sign-in and from
# Settings > Library updates. The zip is also copied to two MusicForge buckets
# so the app imports it in one tap: the public bucket the app reads
# (s3://musicforge-bundles/<tag>.musicforge.zip) and, until the app's older
# signed route is retired, s3://musicforge-pdfs/bundles/<tag>.musicforge.zip.
# The copies run after the release, so a failed copy leaves the release up and
# the app falls back to the file picker. Nothing in this repo is modified.
#
# Secrets used: MUSICFORGE_REPO_TOKEN (already present for update-catalog.yml),
# to check out the private musicforge repo that holds the builder.
# No AWS secrets needed - uses OIDC, same role as update-catalog.yml.

name: Publish MusicForge Bundle

on:
  push:
    branches: [main]
    paths:
      - 'Core/**'
      - 'Include/**'
      - 'Wrappers/**'
  workflow_dispatch: # Allow manual trigger

permissions:
  id-token: write # OIDC to AWS for the S3 copy
  contents: write # create the release and upload the zip

# One release at a time: two pushes in quick succession publish in order, and
# the later run number is always the later release.
concurrency:
  group: publish-bundle
  cancel-in-progress: false

jobs:
  publish-bundle:
    runs-on: ubuntu-latest
    env:
      TAG: bundle-${{ github.run_number }}
      ORDINAL: ${{ github.run_number }}
    steps:
      - name: Checkout lilypond-lead-sheets
        uses: actions/checkout@v6
        with:
          path: lilypond-data

      - name: Checkout musicforge (the bundle builder)
        uses: actions/checkout@v6
        with:
          repository: nicolovejoy/musicforge
          token: ${{ secrets.MUSICFORGE_REPO_TOKEN }}
          path: musicforge

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build the bundle
        # Standard library only, no pip. The chart id map comes from
        # musicforge/catalog/chart_ids.json (the builder's default), so every
        # chart keeps the id the MusicForge catalog already uses for it.
        run: |
          cd musicforge
          python3 tools/build_eric_bundle.py --repo ../lilypond-data --release-tag "$TAG" --release-ordinal "$ORDINAL" --out "../neonscribe-$TAG.musicforge.zip" --apply
          ls -la "../neonscribe-$TAG.musicforge.zip"

      - name: Check the bundle
        # The manifest must carry the release block the app orders bundles by,
        # and the chart count must be in the expected range before anything
        # is published.
        run: |
          python3 - "neonscribe-$TAG.musicforge.zip" "$TAG" "$ORDINAL" <<'EOF'
          import json, sys, zipfile
          path, tag, ordinal = sys.argv[1], sys.argv[2], int(sys.argv[3])
          with zipfile.ZipFile(path) as z:
              manifest = json.loads(z.read('manifest.json'))
          assert manifest['format'] == 'musicforge-bundle/3', manifest['format']
          release = manifest['release']
          assert release['tag'] == tag and release['ordinal'] == ordinal, release
          n = len(manifest['charts'])
          assert n >= 700, f'only {n} charts in the bundle'
          print(f'{n} charts, release {tag} (ordinal {ordinal})')
          EOF

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COUNT=$(python3 -c "import json,zipfile,sys; print(len(json.loads(zipfile.ZipFile(sys.argv[1]).read('manifest.json'))['charts']))" "neonscribe-$TAG.musicforge.zip")
          gh release create "$TAG" "neonscribe-$TAG.musicforge.zip" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "MusicForge bundle $ORDINAL" --notes "$COUNT charts from $GITHUB_SHA. Import this zip in MusicForge (Setlists > Import, or accept the update offer on sign-in)."
          echo "Published $TAG"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::218141621131:role/musicforge-catalog-updater
          aws-region: us-east-1

      - name: Copy the zip to S3
        # After the release, on purpose: a failed copy leaves the release up and
        # the app falls back to the file picker. The older copy runs first, so a
        # failure of the public-bucket copy still leaves the signed route with
        # its zip. A tag's bytes never change, hence the year-long cache header.
        run: |
          aws s3 cp "neonscribe-$TAG.musicforge.zip" "s3://musicforge-pdfs/bundles/$TAG.musicforge.zip" --content-type application/zip
          echo "Copied $TAG to musicforge-pdfs"
          aws s3 cp "neonscribe-$TAG.musicforge.zip" "s3://musicforge-bundles/$TAG.musicforge.zip" --content-type application/zip --cache-control "public, max-age=31536000, immutable"
          echo "Copied $TAG to musicforge-bundles"
