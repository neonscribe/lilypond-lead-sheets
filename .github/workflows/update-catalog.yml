# This workflow is meant to be COPIED to Eric's lilypond-lead-sheets repo.
# It triggers when charts are updated and rebuilds the MusicForge catalog.
#
# Setup required in lilypond-lead-sheets repo:
# 1. Copy this file to .github/workflows/update-catalog.yml
# 2. Add secret: FLY_API_TOKEN (generate with: fly tokens create deploy -a musicforge)
#
# No AWS secrets needed - uses OIDC for secure, keyless authentication.

name: Update MusicForge Catalog

on:
  push:
    branches: [main]
    paths:
      - 'Wrappers/**'
      - 'Core/**'
      - 'Include/**'
  workflow_dispatch: # Allow manual trigger

# Required for OIDC authentication to AWS
permissions:
  id-token: write
  contents: read

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lilypond-lead-sheets
        uses: actions/checkout@v6
        with:
          path: lilypond-data
          # Full history is required: build_catalog.py stamps each song's
          # coreModified from `git log -1 -- <core file>`. A shallow clone
          # makes every file appear last-touched by HEAD, which restamps the
          # whole catalog on every push and stales the entire PDF cache.
          fetch-depth: 0

      - name: Checkout musicforge
        uses: actions/checkout@v6
        with:
          repository: nicolovejoy/musicforge
          token: ${{ secrets.MUSICFORGE_REPO_TOKEN }}
          path: musicforge
          # Full history here too (#413): custom-charts/ songs take their
          # coreModified from `git log -1` in THIS checkout, so a shallow clone
          # restamps them on every run and flips them to "updated" in What's New.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build catalog
        run: |
          cd musicforge
          # Replace submodule with fresh checkout (copy, not symlink, for Docker)
          rm -rf lilypond-data
          cp -r ../lilypond-data .
          python build_catalog.py --ranges-file lilypond-data/Wrappers/range-data.txt --custom-dir custom-charts
          echo "Catalog built successfully"
          ls -la catalog.db

      - name: Export song corpus
        # Derived artifact consumed by split-recording (repertoire matching).
        # Built from the same catalog.db + Core/ this run just produced so it
        # can never be staler than the catalog. --min-songs fails the job on a
        # broken build before anything is uploaded. See
        # docs/superpowers/specs/2026-09-05-song-corpus-export-automation-design.md
        run: |
          cd musicforge
          python tools/export_lyric_corpus.py --db catalog.db --out build/song-corpus.json --min-songs 100

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::218141621131:role/musicforge-catalog-updater
          aws-region: us-east-1

      - name: Upload catalog to S3
        run: |
          aws s3 cp musicforge/catalog.db s3://musicforge-pdfs/catalog.db
          echo "Catalog uploaded to S3"

      - name: Upload song corpus to S3
        # Same bucket, same role, beside catalog.db. Private object; consumers
        # read it with their own credentials and use the ETag for freshness.
        run: |
          aws s3 cp musicforge/build/song-corpus.json s3://musicforge-pdfs/song-corpus.json --content-type application/json
          echo "Song corpus uploaded to S3"

      - name: Upload Core and Include to S3
        run: |
          cd musicforge/lilypond-data
          tar czf /tmp/lilypond-sources.tar.gz Core/ Include/
          aws s3 cp /tmp/lilypond-sources.tar.gz s3://musicforge-pdfs/lilypond-sources.tar.gz
          echo "Uploaded Core + Include to S3"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run catalog smoke tests
        run: |
          cd musicforge
          python test_catalog.py

      - name: Deploy to Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          cd musicforge
          flyctl deploy
          echo "Deployed with updated Core/Include files"

      - name: Post-deploy smoke test
        run: |
          echo "Waiting for deploy to stabilize..."
          sleep 15
          # Verify catalog API returns songs
          CATALOG=$(curl -sf https://www.musicforge.org/api/v2/catalog)
          SONG_COUNT=$(echo "$CATALOG" | python3 -c "import sys,json; print(json.load(sys.stdin)['total'])")
          echo "Catalog returned $SONG_COUNT songs"
          if [ "$SONG_COUNT" -lt 100 ]; then
            echo "FAIL: expected 700+ songs, got $SONG_COUNT"
            exit 1
          fi
          # Guard against the duplicate-title regression (#57): the catalog must
          # not return two entries that share a title.
          echo "$CATALOG" | python3 -c "
          import sys, json
          from collections import Counter
          songs = json.load(sys.stdin)['songs']
          dupes = [t for t, n in Counter(s['title'] for s in songs).items() if n > 1]
          if dupes:
              print('FAIL: duplicate titles in catalog:', dupes)
              for t in dupes:
                  entries = ', '.join(
                      '{}/owner={}'.format(s.get('format'), s.get('owner_id'))
                      for s in songs if s['title'] == t
                  )
                  print('  {}: {}'.format(t, entries))
              sys.exit(1)
          print('No duplicate titles')
          "
          echo "Post-deploy smoke test passed"
